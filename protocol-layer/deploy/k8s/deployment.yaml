apiVersion: v1
kind: ConfigMap
metadata:
  name: protocol-layer-config
data:
  HTTP_PORT: "8080"
  KEEPALIVE_INTERVAL_MS: "30000"
  STALE_CHECK_INTERVAL_MS: "5000"
  STALE_THRESHOLD_MS: "35000"
  MAX_ACCOUNTS_PER_WORKER: "500"
  NODE_RECONNECT_PER_SEC: "10"
  GLOBAL_RECONNECT_PER_SEC: "50"
  COLD_START_BATCH_SIZE: "50"
  COLD_START_INTERVAL_MS: "30000"
  BAILEYS_SYNC_HISTORY: "false"
  BAILEYS_INIT_QUERIES: "false"
  BAILEYS_MARK_ONLINE: "false"
  BAILEYS_EMIT_OWN_EVENTS: "false"
  LOG_LEVEL: "info"
  LOG_PRETTY: "false"
  EVENT_BACKEND: "kafka"
  KAFKA_CLIENT_ID: "protocol-layer"
  KAFKA_SSL: "true"
  KAFKA_TOPIC_ACCOUNT: "protocol.account.events.v1"
  KAFKA_TOPIC_OWNER: "protocol.owner.events.v1"
  KAFKA_TOPIC_MESSAGE: "protocol.message.events.v1"
  KAFKA_TOPIC_GROUP: "protocol.group.events.v1"
  KAFKA_TOPIC_PAIRING: "protocol.pairing.events.v1"

---
apiVersion: v1
kind: Service
metadata:
  name: protocol-master
  labels: { app: protocol-master }
spec:
  clusterIP: None
  selector: { app: protocol-master }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9100
      targetPort: 8080

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: protocol-master
  labels: { app: protocol-master }
spec:
  serviceName: protocol-master
  replicas: 2          # 主备
  selector:
    matchLabels: { app: protocol-master }
  template:
    metadata:
      labels: { app: protocol-master }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: master
          image: unsea/protocol-layer:0.1.0
          env:
            - name: WORKER_ROLE
              value: master
            - name: NODE_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: WORKER_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: protocol-secrets, key: redis_url }
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef: { name: protocol-secrets, key: kafka_brokers }
            - name: MYSQL_CONNECTION_URI
              valueFrom:
                secretKeyRef: { name: protocol-secrets, key: mysql_url }
            - name: MYSQL_ENABLED
              value: "true"
          envFrom:
            - configMapRef: { name: protocol-layer-config }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: protocol-worker
  labels: { app: protocol-worker }
spec:
  clusterIP: None
  selector: { app: protocol-worker }
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: protocol-worker
  labels: { app: protocol-worker }
spec:
  serviceName: protocol-worker
  replicas: 4          # 4C8G 节点上 4 worker × 500 = 2000 账号
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: protocol-worker }
  template:
    metadata:
      labels: { app: protocol-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: worker
          image: unsea/protocol-layer:0.1.0
          env:
            - name: WORKER_ROLE
              value: worker
            - name: NODE_ID
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            - name: WORKER_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: protocol-secrets, key: redis_url }
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef: { name: protocol-secrets, key: kafka_brokers }
            - name: MYSQL_CONNECTION_URI
              valueFrom:
                secretKeyRef: { name: protocol-secrets, key: mysql_url }
            - name: MYSQL_ENABLED
              value: "true"
          envFrom:
            - configMapRef: { name: protocol-layer-config }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "300m", memory: "1Gi" }
            limits:   { cpu: "1500m", memory: "1.5Gi" }
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]   # 优雅退出宽限期
      terminationGracePeriodSeconds: 60
