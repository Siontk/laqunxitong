version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: unsea-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data

  kafka:
    image: bitnami/kafka:3.7
    container_name: unsea-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka-data:/bitnami/kafka
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"

  mysql:
    image: mysql:8.4
    container_name: unsea-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: unsea
      MYSQL_PASSWORD: unsea
      MYSQL_DATABASE: unsea
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:latest
    container_name: unsea-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:latest
    container_name: unsea-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: [prometheus]

  protocol-master:
    build:
      context: ../../
      dockerfile: protocol-layer/deploy/Dockerfile
    container_name: unsea-protocol-master
    environment:
      WORKER_ROLE: master
      NODE_ID: master-1
      WORKER_ID: master-1
      REDIS_URL: redis://redis:6379
      EVENT_BACKEND: kafka
      KAFKA_BROKERS: kafka:9092
      MYSQL_ENABLED: "true"
      MYSQL_CONNECTION_URI: mysql://unsea:unsea@mysql:3306/unsea
      LOG_PRETTY: "true"
      LOG_LEVEL: info
    depends_on: [redis, kafka, mysql]
    ports: ["8080:8080"]

  protocol-worker-1:
    build:
      context: ../../
      dockerfile: protocol-layer/deploy/Dockerfile
    container_name: unsea-protocol-worker-1
    environment:
      WORKER_ROLE: worker
      NODE_ID: node-1
      WORKER_ID: worker-1
      HTTP_PORT: "8081"
      PUBLIC_ENDPOINT: http://localhost:8081
      REDIS_URL: redis://redis:6379
      EVENT_BACKEND: kafka
      KAFKA_BROKERS: kafka:9092
      MYSQL_ENABLED: "true"
      MYSQL_CONNECTION_URI: mysql://unsea:unsea@mysql:3306/unsea
      MAX_ACCOUNTS_PER_WORKER: "500"
      LOG_PRETTY: "true"
    depends_on: [redis, kafka, mysql, protocol-master]
    ports: ["8081:8081"]

  protocol-worker-2:
    build:
      context: ../../
      dockerfile: protocol-layer/deploy/Dockerfile
    container_name: unsea-protocol-worker-2
    environment:
      WORKER_ROLE: worker
      NODE_ID: node-1
      WORKER_ID: worker-2
      HTTP_PORT: "8082"
      PUBLIC_ENDPOINT: http://localhost:8082
      REDIS_URL: redis://redis:6379
      EVENT_BACKEND: kafka
      KAFKA_BROKERS: kafka:9092
      MYSQL_ENABLED: "true"
      MYSQL_CONNECTION_URI: mysql://unsea:unsea@mysql:3306/unsea
      MAX_ACCOUNTS_PER_WORKER: "500"
      LOG_PRETTY: "true"
    depends_on: [redis, kafka, mysql, protocol-master]
    ports: ["8082:8082"]

  protocol-worker-3:
    build:
      context: ../../
      dockerfile: protocol-layer/deploy/Dockerfile
    container_name: unsea-protocol-worker-3
    environment:
      WORKER_ROLE: worker
      NODE_ID: node-1
      WORKER_ID: worker-3
      HTTP_PORT: "8083"
      PUBLIC_ENDPOINT: http://localhost:8083
      REDIS_URL: redis://redis:6379
      EVENT_BACKEND: kafka
      KAFKA_BROKERS: kafka:9092
      MYSQL_ENABLED: "true"
      MYSQL_CONNECTION_URI: mysql://unsea:unsea@mysql:3306/unsea
      MAX_ACCOUNTS_PER_WORKER: "500"
      LOG_PRETTY: "true"
    depends_on: [redis, kafka, mysql, protocol-master]
    ports: ["8083:8083"]

  protocol-worker-4:
    build:
      context: ../../
      dockerfile: protocol-layer/deploy/Dockerfile
    container_name: unsea-protocol-worker-4
    environment:
      WORKER_ROLE: worker
      NODE_ID: node-1
      WORKER_ID: worker-4
      HTTP_PORT: "8084"
      PUBLIC_ENDPOINT: http://localhost:8084
      REDIS_URL: redis://redis:6379
      EVENT_BACKEND: kafka
      KAFKA_BROKERS: kafka:9092
      MYSQL_ENABLED: "true"
      MYSQL_CONNECTION_URI: mysql://unsea:unsea@mysql:3306/unsea
      MAX_ACCOUNTS_PER_WORKER: "500"
      LOG_PRETTY: "true"
    depends_on: [redis, kafka, mysql, protocol-master]
    ports: ["8084:8084"]

volumes:
  redis-data:
  kafka-data:
  mysql-data:
  prom-data:
  grafana-data:
