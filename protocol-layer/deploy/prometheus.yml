global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'protocol-master'
    static_configs:
      - targets: ['protocol-master:8080']
  - job_name: 'protocol-workers'
    static_configs:
      - targets: ['protocol-worker-1:8081', 'protocol-worker-2:8082', 'protocol-worker-3:8083', 'protocol-worker-4:8084']
